name: Deploy

# Builds and publishes the web app from source on every push to main.
#
# WHY THIS EXISTS: deployment used to mean running `flutter build web` by hand
# and committing build/web, with Vercel serving those committed files
# (buildCommand: null). That decoupled the deployed app from the source: the
# sign-up race fix landed on 2026-07-31 but the bundle in git was built
# 2026-06-25, so the fix never reached a single user for five weeks. Building
# in CI from the commit being deployed makes that failure mode impossible.
#
# Required repository secrets:
#   SUPABASE_URL, SUPABASE_ANON_KEY   - client config, injected via --dart-define
#   WEB_REDIRECT_URL                  - OAuth redirect target
#   GOOGLE_WEB_CLIENT_ID              - Google sign-in
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD - migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Checks every secret this workflow needs, before doing any work.
  #
  # Without this the first missing secret surfaced as `supabase link
  # --project-ref ""` followed by "Access token not provided" — which names
  # neither the secret nor where to set it. Worse, the Vercel secrets were not
  # validated until after a three-minute Flutter build, so a missing deploy
  # token cost a full build to discover. This reports EVERY missing secret at
  # once, in seconds.
  #
  # This job deliberately FAILS rather than skipping: unlike the integration
  # suite, a deploy that cannot run is a real problem — it means merged code is
  # not reaching users, which is exactly how a five-week-stale bundle went
  # unnoticed in production.
  preflight:
    name: Check deploy secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          WEB_REDIRECT_URL: ${{ secrets.WEB_REDIRECT_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD \
                      SUPABASE_URL SUPABASE_ANON_KEY \
                      VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -z "${!name}" ] && missing+=("$name")
          done

          # Not fatal: these only affect OAuth redirects and Google sign-in.
          for name in WEB_REDIRECT_URL GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning title=Optional secret unset::$name is not set; the build will use an empty value."
            fi
          done

          if [ ${#missing[@]} -ne 0 ]; then
            {
              echo "## Deploy cannot run"
              echo
              echo "These repository secrets are not set:"
              echo
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
              echo
              echo "Add them under **Settings → Secrets and variables → Actions**."
              echo "Each one is described in [docs/RELEASE.md](docs/RELEASE.md#one-time-setup)."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Deploy secrets missing::Not set: ${missing[*]}. Add them under Settings > Secrets and variables > Actions; see docs/RELEASE.md#one-time-setup."
            exit 1
          fi

          echo "All required deploy secrets are present."

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          # Surfaces divergence between local migrations and the live schema.
          # The live database is known to have applied migrations that exist in
          # no local file, so read this output rather than skimming past it.
          supabase migration list
          supabase db push

  deploy:
    name: Build and deploy web
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEB_REDIRECT_URL: ${{ secrets.WEB_REDIRECT_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: scripts/build_web.sh

      - name: Verify no secrets in bundle
        run: scripts/verify_bundle.sh

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel deploy build/web \
            --prod \
            --yes \
            --token "$VERCEL_TOKEN" \
            > deployment-url.txt
          echo "DEPLOYMENT_URL=$(cat deployment-url.txt)" >> "$GITHUB_ENV"

      - name: Post-deploy smoke test
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: scripts/smoke_test.sh "$DEPLOYMENT_URL"
